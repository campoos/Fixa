# Render Blueprint — Fixa
services:
  - type: web
    name: fixa
    runtime: node
    plan: free
    buildCommand: cd web && npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_USER
        value: João
      - key: SSO_SECRET
        sync: false
      - key: APP_PASS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # push (DESIGN-PUSH.md): sem o par VAPID o app roda igual, só sem notificação
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contato@fixaestudos.com.br
