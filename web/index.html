<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12101b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- interactive-widget=resizes-content: teclado mobile encolhe o layout viewport → dock sticky pousa acima dele (DESIGN-LICAO-UI §5.d)
         viewport-fit=cover: sem ele todo env(safe-area-inset-*) vale 0 e a barra de baixo encosta na
         faixa do gesto do Android — é o que faz o safe-area do shell existir de verdade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <title>Fixa — aprenda de um jeito que fixa</title>
    <script>
      // aplica o tema antes do primeiro pixel: sem isso pisca claro até o React montar.
      // Mesma regra do ThemeProvider (src/lib/theme.tsx) — escolha salva manda, senão o aparelho.
      try {
        var t = localStorage.getItem("tv2-theme");
        var escuro = t === "dark" || (t !== "light" && !matchMedia("(prefers-color-scheme: light)").matches);
        if (escuro) document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').content = escuro ? "#12101b" : "#f8f7fb";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
