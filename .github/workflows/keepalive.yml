# Anti-cold-start de graça: o Render free hiberna após 15 min de inatividade (primeira visita
# paga ~50s de boot — inaceitável pra landing). Pingando a cada ~10 min o app fica quente 24/7
# e ainda cabe na cota free (~744h/mês de 750h). Aposentar quando migrar pro plano pago.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /api/health
        run: curl -sS -m 60 -o /dev/null -w "health %{http_code} em %{time_total}s\n" https://fixa-hbn1.onrender.com/api/health
